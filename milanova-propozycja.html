<title>Materiał dla Milanova Clinic</title>
<style>
  :root{--ink:#10152B;--soft:#3A4260;--faint:#636986;--paper:#FBFAF7;--paper2:#F2F0EA;
        --rule:#DCD8CD;--gold:#856813;--brick:#9E3520;
        --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
        --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{--ink:#ECEAE3;--soft:#B9BDD0;--faint:#8A90A8;
        --paper:#0E1220;--paper2:#171C2E;--rule:#2A3149;--gold:#E0BC55;--brick:#E4907C}}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;
       line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;min-height:80vh;
       align-items:center;justify-content:center}
  .karta{max-width:46ch;padding:40px 28px}
  .marka{font-family:var(--mono);font-size:13px;letter-spacing:.34em;font-weight:700;margin-bottom:28px}
  .marka span{color:var(--gold)}
  h1{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.2;margin-bottom:12px}
  p{color:var(--soft);margin-bottom:20px;font-size:16px}
  label{display:block;font-size:14px;font-weight:650;margin-bottom:7px}
  input{width:100%;font-family:var(--mono);font-size:17px;letter-spacing:.06em;padding:12px 14px;
        border:1px solid var(--rule);border-radius:4px;background:var(--paper2);color:var(--ink)}
  input:focus{outline:2px solid var(--gold);outline-offset:1px}
  button{margin-top:14px;width:100%;font-family:var(--sans);font-size:16px;font-weight:650;
         padding:13px;border:0;border-radius:4px;background:var(--ink);color:var(--paper);cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .blad{color:var(--brick);font-size:15px;margin-top:14px;min-height:1.4em}
  .stopka{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);
          font-size:13.5px;color:var(--faint)}
</style>
<div class="karta">
  <div class="marka">TAMAIA<span>.</span></div>
  <h1>Materiał przygotowany dla Milanova Clinic</h1>
  <p>Dokument jest zabezpieczony hasłem, które przekazujemy osobno.</p>

           placeholder="xxxx-xxxx-xxxx">
    <button id="b" type="submit">Otwórz dokument</button>
  </form>
  <div class="blad" id="e"></div>

</div>

function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
document.getElementById('f').addEventListener('submit',async function(ev){

  try{

    const jawne=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},klucz,reszta);
