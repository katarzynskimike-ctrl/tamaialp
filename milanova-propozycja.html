<style>
  :root{--ink:#1B2C4F;--soft:#40536F;--faint:#5A6B7A;--paper:#FAF8F3;--paper2:#F2EDE1;

       align-items:center;justify-content:center}
  .karta{max-width:46ch;padding:40px 28px}

  h1{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.2;margin-bottom:12px}
  p{color:var(--soft);margin-bottom:20px;font-size:16px}
  label{display:block;font-size:14px;font-weight:650;margin-bottom:7px}
  input{width:100%;font-family:var(--mono);font-size:17px;letter-spacing:.06em;padding:12px 14px;
        border:1px solid var(--rule);border-radius:4px;background:var(--paper2);color:var(--ink)}
  input:focus{outline:2px solid var(--gold);outline-offset:1px}
  button{margin-top:14px;width:100%;font-family:var(--sans);font-size:16px;font-weight:650;
         padding:13px;border:0;border-radius:4px;background:var(--ink);color:var(--paper);cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .blad{color:var(--brick);font-size:15px;margin-top:14px;min-height:1.4em}

          font-size:13.5px;color:var(--faint)}
</style>
